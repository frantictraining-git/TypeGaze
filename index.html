<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeGaze - Visual Typing Tutor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <h2>Lessons</h2>
            <div class="lesson-scroll-area">
                <ul id="lesson-list">
                    <!-- Populated by JavaScript -->
                </ul>
            </div>
            
            <div class="custom-lesson-box">
                <h3>Custom Lesson</h3>
                <textarea id="custom-lesson-text" placeholder="Paste your own text here to practice..." rows="3"></textarea>
                <button id="add-custom-lesson-btn" class="primary-btn">Start Custom Lesson</button>
            </div>
        </aside>

        <div class="main-content">
            <header class="glass-panel">
                <div class="sidebar-header">
                    <h1>TypeGaze</h1>
                    <p>Master touch typing with visual guidance</p>
                </div>
            </header>

            <main>
                <div class="text-display glass-panel">
                    <div id="start-lesson-overlay" class="start-lesson-overlay">
                        <button id="start-lesson-btn" class="primary-btn pulse">Click to Start Typing</button>
                    </div>
                    <div class="text-wrapper">
                        <span id="completed-text" class="completed"></span><span id="current-char" class="current"></span><span id="remaining-text" class="remaining"></span>
                    </div>
                    <div id="finger-hint" class="finger-hint"></div>
                    <div class="stats">
                        <span id="wpm">0 WPM</span>
                        <span id="accuracy">100% Accuracy</span>
                    </div>
                </div>

                <div class="keyboard-area">
                    <div id="virtual-keyboard" class="virtual-keyboard glass-panel">
                        <!-- Keyboard rows will be generated by JavaScript -->
                    </div>
                    
                    <!-- Visual Finger Guides -->
                    <div class="hands-overlay">
                        <div id="left-hand" class="hand left-hand">
                            <div class="finger pinky left" data-finger="l-pinky" data-name="Left Pinky"></div>
                            <div class="finger ring left" data-finger="l-ring" data-name="Left Ring"></div>
                            <div class="finger middle left" data-finger="l-middle" data-name="Left Middle"></div>
                            <div class="finger index left" data-finger="l-index" data-name="Left Index"></div>
                            <div class="finger thumb left" data-finger="l-thumb" data-name="Left Thumb"></div>
                        </div>
                        <div id="right-hand" class="hand right-hand">
                            <div class="finger thumb right" data-finger="r-thumb" data-name="Right Thumb"></div>
                            <div class="finger index right" data-finger="r-index" data-name="Right Index"></div>
                            <div class="finger middle right" data-finger="r-middle" data-name="Right Middle"></div>
                            <div class="finger ring right" data-finger="r-ring" data-name="Right Ring"></div>
                            <div class="finger pinky right" data-finger="r-pinky" data-name="Right Pinky"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Custom Notification Modal -->
        <div id="abandon-modal" class="modal hidden">
            <div class="modal-content glass-panel">
                <h2>Abandon Session?</h2>
                <p>Are you sure you want to end the current practice and start a new one?</p>
                <div class="modal-buttons">
                    <button id="cancel-abandon-btn" class="secondary-btn">Cancel</button>
                    <button id="confirm-abandon-btn" class="primary-btn">OK</button>
                </div>
            </div>
        </div>

        <div id="notification-modal" class="modal hidden">
            <div class="notification-content">
                <span class="message">Great job! Press <strong>Enter</strong> to go to the next lesson.</span>
                <span class="icon">✨</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
